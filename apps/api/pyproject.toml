[project]
name = "driftguard-api"
version = "0.2.0"
description = "Driftguard API: AI code review for Terraform PRs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "boto3>=1.35.0",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "stripe>=11.4.0",
    # worker
    "celery[redis]>=5.4.0",
    "celery-types>=0.22.0",
    # pgvector
    "pgvector>=0.3.5",
    # LLM router
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "tiktoken>=0.7.0",
    # storage (R2 / S3-compat already via boto3)
    "boto3>=1.35.0",
    # email
    "resend>=2.4.0",
    "python-hcl2>=4.3.0",    # Terraform HCL2 parser
    "pyyaml>=6.0",            # Kubernetes / GHA YAML
    # observability
    "posthog>=3.5.0",
    "sentry-sdk[fastapi]>=2.14.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"driftguard/integrations/*" = ["S603", "S607"]
"driftguard/autonomy/context.py" = ["S603", "S607"]
"driftguard/core/config.py" = ["S105"]
"driftguard/services/email.py" = ["E501"]   # HTML strings in f-strings can't wrap

[tool.mypy]
python_version = "3.12"
# Deliberately not --strict: this codebase was written untyped-first, and a
# blanket strict flag would bury real findings under thousands of missing
# annotations. These settings catch the class of bug that actually bites
# (attribute access on None, wrong argument types) without that noise.
warn_redundant_casts = true
warn_unused_ignores = true

# Third-party packages that genuinely ship no type information. Scoped per
# module rather than a global ignore_missing_imports, so a future dependency
# without stubs shows up as a new error instead of being silently swallowed.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "hcl2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
