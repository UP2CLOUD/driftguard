name: Auto Fix CI Failures

# ⚠️ SECURITY NOTE (carried over from the upstream example this is adapted
# from: github.com/anthropics/claude-code-action/blob/main/examples/ci-failure-auto-fix.yml)
#
# This workflow checks out the PR branch and runs build/test commands
# against it with elevated permissions (contents:write, id-token:write),
# then pushes directly back to that branch. Code from the PR branch runs in
# a trusted context with repo write access. Only safe because every
# collaborator with write access to this repo is fully trusted (verified:
# the only collaborator is the repo owner) -- do not copy this pattern into
# a repo that accepts contributions from untrusted or semi-trusted authors.
#
# Adapted from the upstream example to push the fix directly onto the
# existing failing PR's branch (rather than opening a parallel
# claude-auto-fix-ci-* branch/PR) -- simpler for a repo where every PR
# already comes from a trusted source, and matches how fixes have been
# pushed onto existing PRs manually all session.

on:
  workflow_run:
    workflows: ["ci-api", "ci-web"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write
  id-token: write # Required for OIDC token exchange

jobs:
  auto-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      github.repository_owner == 'UP2CLOUD'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the failing PR's branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bail out if this branch already has an auto-fix attempt
        id: guard
        run: |
          # Runaway-loop guard: if a previous auto-fix commit is already in
          # the last 20 commits on this branch and CI is STILL failing, a
          # second automated attempt is unlikely to help and risks looping
          # forever (fix -> still fails -> re-trigger -> fix -> ...).
          if git log -20 --format=%B | grep -q "^driftguard-autofix:"; then
            echo "already_attempted=true" >> "$GITHUB_OUTPUT"
            echo "⚠ A previous auto-fix commit already exists on this branch — skipping to avoid a retry loop. Needs a human look."
          else
            echo "already_attempted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check API key is configured
        id: key_check
        if: steps.guard.outputs.already_attempted == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup git identity
        if: steps.guard.outputs.already_attempted == 'false' && steps.key_check.outputs.has_key == 'true'
        run: |
          git config --global user.email "noreply@anthropic.com"
          git config --global user.name "Claude"

      - name: Install uv (apps/api toolchain)
        if: steps.guard.outputs.already_attempted == 'false' && steps.key_check.outputs.has_key == 'true'
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: latest

      - name: Sync API deps
        if: steps.guard.outputs.already_attempted == 'false' && steps.key_check.outputs.has_key == 'true'
        working-directory: apps/api
        run: uv sync --all-extras

      - name: Install pnpm (apps/web toolchain)
        if: steps.guard.outputs.already_attempted == 'false' && steps.key_check.outputs.has_key == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Sync web deps
        if: steps.guard.outputs.already_attempted == 'false' && steps.key_check.outputs.has_key == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Get CI failure details
        id: failure_details
        if: steps.guard.outputs.already_attempted == 'false' && steps.key_check.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run_url=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json url --jq '.url')
          workflow_name=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json workflowName --jq '.workflowName')
          failed_jobs=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | {name, url}]')

          {
            echo "run_url=$run_url"
            echo "workflow_name=$workflow_name"
            echo "failed_jobs<<FAILEDJOBS_EOF"
            echo "$failed_jobs"
            echo "FAILEDJOBS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fix CI failures with Claude
        if: steps.guard.outputs.already_attempted == 'false' && steps.key_check.outputs.has_key == 'true'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(uv:*),Bash(pnpm:*),Bash(npx:*)"
          prompt: |
            CI just failed on this PR's branch (${{ github.event.workflow_run.head_branch }}).

            Failed workflow: ${{ steps.failure_details.outputs.workflow_name }}
            Run: ${{ steps.failure_details.outputs.run_url }}
            PR: #${{ github.event.workflow_run.pull_requests[0].number }}
            Failed jobs: ${{ steps.failure_details.outputs.failed_jobs }}

            Investigate the actual failure (pull the job logs via
            `gh run view ${{ github.event.workflow_run.id }} --log-failed`
            if you need more detail than the summary above) and fix the
            real root cause — not a workaround that hides the symptom
            (no skipping tests, no --no-verify, no loosening an assertion
            just to make it pass).

            If you cannot determine a confident, correct fix, do not guess —
            leave the branch as-is and instead post a PR comment via
            `gh pr comment ${{ github.event.workflow_run.pull_requests[0].number }}`
            explaining what you found and why you're not attempting a fix.

            If you do fix it:
            - Verify locally before pushing: apps/api changes → `cd apps/api
              && uv run ruff check . && uv run ruff format --check . && uv
              run pytest <relevant files> -v` (skip tests needing a live
              Postgres this runner doesn't have). apps/web changes → `cd
              apps/web && npx tsc --noEmit && pnpm lint && pnpm test`.
            - Commit directly onto this same branch (no new branch, no new
              PR — this PR already exists) with a message that starts with
              the literal line `driftguard-autofix: <one-line summary>`
              followed by a blank line and a real explanation of the root
              cause and fix (this exact marker is required — a later run of
              this same workflow checks for it to avoid retrying forever on
              a branch that already had an auto-fix attempt).
            - Push with `git push`.
