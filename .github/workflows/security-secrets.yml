name: security-secrets

# Two gates, deliberately different in scope:
#
#   scan-diff     runs on every PR over the pushed commit range only. Fast, and
#                 it fails the PR that *introduces* a credential.
#   scan-tfstate  refuses Terraform state and plan binaries outright. State
#                 files embed resource attributes verbatim -- RDS passwords,
#                 access keys, private keys -- so a committed tfstate is a
#                 credential dump regardless of what gitleaks makes of it.
#
# Full-history scanning is intentionally *not* run on every PR: the repository
# has a known historical exposure (see docs/SECRET_ROTATION.md) that cannot be
# removed without rewriting shared history, so a history scan would fail every
# run and get muted. It runs on a schedule instead, where a human reads it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-diff:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Runs before the real scan. A misconfigured allowlist fails open --
      # gitleaks exits 0 and the gate becomes decoration -- so prove on
      # synthetic fixtures that real credentials are still caught and known
      # placeholders are still ignored, then trust the scan below.
      - name: Self-test the scanner configuration
        run: ./scripts/secrets-selftest.sh

      # `--no-git` scans the checked-out files rather than commits. That is the
      # property we actually care about on a PR: whatever state main would be
      # in after this merge must contain no credentials.
      - name: Scan working tree
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  scan-tfstate:
    name: No Terraform state committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject tracked state and plan artifacts
        run: ./scripts/check-no-tfstate.sh

  scan-history:
    name: Secret scan (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      # Reports, never fails. The known historical hit is documented in
      # docs/SECRET_ROTATION.md; the value of this job is spotting a *new* one.
      - name: Scan history (report only)
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format json \
            --report-path gitleaks-history.json \
            --exit-code 0
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("gitleaks-history.json")
          findings = json.loads(p.read_text() or "[]")
          print(f"historical findings: {len(findings)}")
          for f in findings:
              # Values are already redacted by --redact; print location only.
              print(f"  {f.get('Commit','')[:12]} {f.get('File')}:{f.get('StartLine')} [{f.get('RuleID')}]")
          PY

      - name: Upload history report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: gitleaks-history
          path: gitleaks-history.json
          if-no-files-found: ignore
