name: ci-api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match docker-compose.yml: migration 002 runs
        # `CREATE EXTENSION IF NOT EXISTS vector`, which plain
        # postgres:16-alpine cannot satisfy ("extension \"vector\" is not
        # available"). The unit tests mock the database and never run
        # migrations, so this mismatch stayed invisible until the boot
        # smoke test below started applying them for real.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: driftguard
          POSTGRES_PASSWORD: driftguard
          POSTGRES_DB: driftguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U driftguard"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: latest

      - name: Sync deps
        working-directory: apps/api
        run: uv sync --all-extras

      - name: Lint (ruff check)
        working-directory: apps/api
        run: uv run ruff check .

      - name: Format check (ruff format)
        working-directory: apps/api
        run: uv run ruff format --check .

      # Gated now that the codebase type-checks clean (was 106 errors).
      # Keeping it green is far cheaper than paying that debt down twice --
      # several of those errors turned out to be live bugs, not noise.
      - name: Type check (mypy)
        working-directory: apps/api
        run: uv run mypy driftguard

      - name: Test (unit only, exclude eval)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://driftguard:driftguard@localhost:5432/driftguard
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci
          ENVIRONMENT: ci
        run: uv run pytest -v --ignore=tests/eval

      # The suite above overrides get_db and never binds a socket, so it
      # cannot catch a crash that happens at import time or during startup.
      # A CORS_ORIGINS value that was valid in docker-compose.yml but invalid
      # to pydantic-settings took production down exactly that way: every
      # test passed and the container still died ~1s after start. This step
      # boots the app with the real compose environment and curls the same
      # endpoint the Dockerfile HEALTHCHECK uses.
      - name: Smoke — boot API with real docker-compose env
        run: ./scripts/smoke-boot-api.sh
        env:
          SMOKE_DATABASE_URL: postgresql+asyncpg://driftguard:driftguard@localhost:5432/driftguard
          SMOKE_REDIS_URL: redis://localhost:6379/0

  checkov-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Checkov on API Dockerfile
        uses: bridgecrewio/checkov-action@dfb51aed1b783289b0d3f255028e7a88d5e8caa1 # master
        with:
          directory: apps/api
          framework: dockerfile
          quiet: false
          soft_fail: false
