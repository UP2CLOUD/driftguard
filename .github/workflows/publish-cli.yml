name: publish-cli

# Builds and publishes apps/cli (the `driftguard-cli` package, `dg`/`driftguard`
# binaries) to PyPI. Triggered by pushing a tag matching cli-v*.*.* (e.g.
# cli-v0.1.0) or manually via workflow_dispatch for a dry-run build check.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token secret needed in this
# repo. One-time setup required on the PyPI side before the first real
# publish: on pypi.org, create (or claim) the `driftguard-cli` project, then
# under its "Publishing" settings add a trusted publisher with:
#   Owner: UP2CLOUD   Repository: driftguard   Workflow: publish-cli.yml
#   Environment: pypi
# See https://docs.pypi.org/trusted-publishers/ for the walkthrough.

on:
  push:
    tags:
      - "cli-v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, skip the PyPI publish step"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install package + dev deps and run tests
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -v

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          tag_version="${GITHUB_REF_NAME#cli-v}"
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag cli-v$tag_version does not match pyproject.toml version $pkg_version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: driftguard-cli-dist
          path: apps/cli/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli-v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/driftguard-cli
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: driftguard-cli-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1
        with:
          packages-dir: dist/
