name: deploy-fly

on:
  workflow_dispatch:

# Manual-dispatch only: no Fly.io app is provisioned for this project (GCP Cloud
# Run via deploy-api.yml is the deploy target — see DEPLOY.md). This workflow is
# kept as an opt-in alternative but must not auto-run on every apps/api push,
# since flyctl has no app/token to deploy to.

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        working-directory: apps/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 300
